name: Verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install OCR (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin tesseract-ocr-tel tesseract-ocr-spa
      - name: Install OCR (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'tesseract-5.4.0.20240606.exe'
          Invoke-WebRequest -Uri 'https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe' -OutFile $installer -TimeoutSec 120 -MaximumRetryCount 2
          $expected = 'C885FFF6998E0608BA4BB8AB51436E1C6775C2BAFC2559A19B423E18678B60C9'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expected) { throw 'Tesseract installer checksum mismatch' }
          $installed = Start-Process -FilePath $installer -ArgumentList '/S', '/AllUsers' -Wait -PassThru -WindowStyle Hidden
          if ($installed.ExitCode -ne 0) { throw "Tesseract installer failed: $($installed.ExitCode)" }
          $directory = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          if (-not (Test-Path (Join-Path $directory 'tesseract.exe'))) { throw 'Tesseract executable missing after installation' }
          $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -r requirements.txt
      - name: Fetch tagged language resources (Windows)
        if: runner.os == 'Windows'
        run: python scripts/fetch_tessdata.py
      - run: python scripts/check_ocr.py
      - run: python scripts/check_holdouts.py
      - run: python -m ruff check .
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t customer-service-bot .
      - run: docker run --rm customer-service-bot python scripts/check_ocr.py
