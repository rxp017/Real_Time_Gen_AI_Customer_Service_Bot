name: Verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install OCR (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin tesseract-ocr-tel tesseract-ocr-spa
      - name: Install OCR (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress -y
      - run: python -m pip install -r requirements.txt
      - name: Fetch tagged language resources (Windows)
        if: runner.os == 'Windows'
        run: python scripts/fetch_tessdata.py
      - run: python scripts/check_ocr.py
      - run: python scripts/check_holdouts.py
      - run: python -m ruff check .
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t customer-service-bot .
      - run: docker run --rm customer-service-bot python scripts/check_ocr.py
